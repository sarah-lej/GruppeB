<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="module" src="/script.js"></script>
    <link rel="stylesheet" href="ccs.css">

</head>
<body>
<!--Eingabe für ToDo -->
<div class="col-9">
    <div class="p-3 bg-white rounded shadow-sm">

        <h1 class="mb-3">Willkommen bei deiner eigenen ToDo Liste!</h1>

        <div class="mb-4">
            <textarea id="newToDo" class="form-control mb-2" rows="3" placeholder="Was steht alles an?"></textarea>
            <button id="btnCreateToDo">Aufgabe erstellen</button>
            <ul id="taskList"></ul>
        </div>
    </div>
</div>

<!-- Aufgaben filtern -->
<div class="task-filter">
    <label for="taskFilter">Aufgaben filtern:</label>

    <select id="taskFilter">
        <option value="all">Alle Aufgaben</option>
        <option value="open">Offene Aufgaben</option>
        <option value="done">Erledigte Aufgaben</option>
    </select>
</div>

</body>
</html>
