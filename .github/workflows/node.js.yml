name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: ESLint ausführen
        run: npm run lint

      - name: Prettier überprüfen
        run: npm run format:check

      - name: TypeScript überprüfen
        run: npx tsc --noEmit

      - name: Jest Tests ausführen
        run: npm test -- --ci --runInBand
